# =============================================================================
# OJ 题解站 — GitHub Actions 自动更新工作流
#
# 触发方式：
#   1. repository_dispatch（Cloudflare Functions 网页触发）
#   2. workflow_dispatch（GitHub 页面手动触发）
#
# 流程：运行爬虫 → 重建索引 → git commit & push → Cloudflare Pages 自动部署
# =============================================================================
name: 更新题解

on:
  repository_dispatch:
    types: [update-solutions]
  workflow_dispatch:
    inputs:
      source:
        description: 更新源
        required: true
        default: all
        type: choice
        options:
          - all
          - luogu
          - dfboy
          - rebuild
      force:
        description: 强制重新生成所有文件
        required: false
        default: false
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    # 给 30 分钟超时（洛谷 400+ 题 + 东方博宜 1000+ 题约需 15-25 分钟）
    timeout-minutes: 30

    steps:
      # ======== 1. 检出代码 ========
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 需要完整 git 历史用于提交
          fetch-depth: 0

      # ======== 2. 设置 Node.js ========
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ======== 3. 解析参数 ========
      - name: 解析触发参数
        id: params
        run: |
          # repository_dispatch 模式：从 client_payload 读取
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "source=${{ github.event.client_payload.source }}" >> $GITHUB_OUTPUT
            echo "force=${{ github.event.client_payload.force }}" >> $GITHUB_OUTPUT
            echo "luogu_cookie=${{ github.event.client_payload.luogu_cookie }}" >> $GITHUB_OUTPUT
            echo "dfboy_user=${{ github.event.client_payload.dfboy_user }}" >> $GITHUB_OUTPUT
            echo "dfboy_pass=${{ github.event.client_payload.dfboy_pass }}" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch 模式：从 inputs 读取
            echo "source=${{ github.event.inputs.source }}" >> $GITHUB_OUTPUT
            echo "force=${{ github.event.inputs.force }}" >> $GITHUB_OUTPUT
          fi
          echo "mode=${{ github.event_name }}" >> $GITHUB_OUTPUT

      # ======== 4. 运行爬虫脚本 ========
      - name: 运行洛谷爬虫
        if: steps.params.outputs.source == 'luogu' || steps.params.outputs.source == 'all'
        env:
          LUOGU_COOKIE: ${{ steps.params.outputs.luogu_cookie }}
        run: |
          FORCE_FLAG=""
          if [[ "${{ steps.params.outputs.force }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          echo "🚀 开始更新洛谷题解..."
          node luogu_fetch.js $FORCE_FLAG
          echo "✅ 洛谷题解更新完成"

      - name: 运行东方博宜爬虫
        if: steps.params.outputs.source == 'dfboy' || steps.params.outputs.source == 'all'
        env:
          DFBOY_USER: ${{ steps.params.outputs.dfboy_user }}
          DFBOY_PASS: ${{ steps.params.outputs.dfboy_pass }}
        run: |
          FORCE_FLAG=""
          if [[ "${{ steps.params.outputs.force }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          echo "🚀 开始更新东方博宜题解..."
          echo "📋 步骤 1/2: 爬取题目描述..."
          node dfboy_fetch.js --nocodes $FORCE_FLAG

          echo ""
          echo "📋 步骤 2/2: 爬取 AC 代码..."
          if [ -f "fetch_dfboy_codes.js" ]; then
            node fetch_dfboy_codes.js $FORCE_FLAG
          else
            echo "⚠️ fetch_dfboy_codes.js 不存在，跳过代码爬取"
          fi
          echo "✅ 东方博宜题解更新完成"

      # ======== 5. 重建索引 ========
      - name: 重建搜索索引
        run: |
          echo "🔨 重建索引..."
          node build.js
          echo "✅ 索引重建完成"

      # ======== 6. 提交并推送 ========
      - name: 提交并推送更新
        run: |
          git config user.name "OJ Bot"
          git config user.email "bot@zymojblog.top"

          # 只添加 solutions/ data/ 目录下的变更
          git add solutions/ data/ js/ css/ index.html

          # 检查是否有变更
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️ 没有变更需要提交"
          else
            git commit -m "🤖 自动更新题解 ($(date '+%Y-%m-%d %H:%M'))"
            git push
            echo "✅ 已推送更新，Cloudflare Pages 将自动部署"
          fi
