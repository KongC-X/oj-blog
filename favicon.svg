<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- 顶部高光线 -->
  <rect x="8" y="0" width="16" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
  <!-- 内发光 -->
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <!-- OI 文字 -->
  <text x="16" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800"
        fill="url(#accent)" text-anchor="middle" letter-spacing="-0.5">OI</text>
</svg>
